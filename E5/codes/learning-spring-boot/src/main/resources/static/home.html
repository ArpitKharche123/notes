<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockline — Product catalog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
          href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
          rel="stylesheet">

  <style>
    :root {
      --bg: #F4F5F7;
      --surface: #FFFFFF;
      --ink: #1B1F27;

      --ink-70: rgba(27,31,39,.7);
      --ink-45: rgba(27,31,39,.45);
      --ink-30: rgba(27,31,39,.3);
      --ink-15: rgba(27,31,39,.15);
      --ink-08: rgba(27,31,39,.08);

      --primary: #2B4C7E;
      --primary-dark: #1F3A63;
      --primary-08: rgba(43,76,126,.08);

      --brass: #B8862B;
      --brass-light: #E8C77A;

      --success: #2F7D5D;
      --danger: #B5432F;
      --danger-dark: #96351F;
      --danger-08: rgba(181,67,47,.08);

      --font-display: 'Zilla Slab', Georgia, serif;
      --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

      --radius-sm: 4px;
      --radius-md: 6px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    *:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    /* =========================
       Top Navigation
       ========================= */

    .topbar {
      background: var(--ink);
      color: #fff;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
    }

    .nav-links a {
      color: rgba(255,255,255,.72);
      text-decoration: none;
      font-size: .9rem;
      padding: .3rem 0;
      border-bottom: 2px solid transparent;
      transition: color .15s ease, border-color .15s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #fff;
      border-bottom-color: var(--brass-light);
    }

    /* =========================
       Main Container
       ========================= */

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.25rem 1.5rem 4rem;
    }

    /* =========================
       Hero
       ========================= */

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1.5px solid var(--ink-08);
    }

    .hero-count {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 2.75rem;
      line-height: 1;
      color: var(--primary);
    }

    .hero-label {
      font-size: .9rem;
      color: var(--ink-45);
      margin-top: .3rem;
    }

    .hero-controls {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
    }

    /* =========================
       Search
       ========================= */

    .search-box {
      display: flex;
      gap: .5rem;
      align-items: center;
    }

    .search-box input {
      width: 220px;
      padding: .55rem .75rem;
      border: 1.5px solid var(--ink-15);
      border-radius: var(--radius-sm);
      font-size: .875rem;
      background: var(--surface);
      color: var(--ink);
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* =========================
       Buttons
       ========================= */

    .btn {
      font-weight: 500;
      font-size: .875rem;
      padding: .55rem 1rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition:
              background-color .15s ease,
              border-color .15s ease,
              color .15s ease,
              transform .08s ease;
      text-decoration: none;
    }

    .btn-sm {
      padding: .4rem .75rem;
      font-size: .8125rem;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--ink-15);
      color: var(--ink);
    }

    .btn-outline:hover {
      border-color: var(--ink-30);
      background: var(--ink-08);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-45);
    }

    .btn-ghost:hover {
      color: var(--ink);
    }

    .btn-danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    /* =========================
       Banner
       ========================= */

    #banner {
      margin-bottom: 0;
    }

    .banner-visible {
      background: var(--primary-08);
      border: 1.5px solid rgba(43,76,126,.2);
      border-radius: var(--radius-md);
      padding: .75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: .875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .banner-close {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: .8rem;
      text-decoration: underline;
      white-space: nowrap;
    }

    /* =========================
       State
       ========================= */

    .state-block {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--ink-45);
    }

    .state-block p {
      margin: 0 0 1rem;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--ink-08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       Product Grid
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .product-card {
      position: relative;
      background: var(--surface);
      border: 1.5px solid var(--ink-08);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.1rem 1rem 1.6rem;
      transition:
              border-color .15s ease,
              box-shadow .15s ease,
              transform .15s ease;
    }

    .product-card:hover {
      border-color: var(--ink-30);
      box-shadow: 0 6px 18px rgba(27,31,39,.08);
      transform: translateY(-2px);
    }

    .product-card::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 1.15rem;
      width: 14px;
      height: 14px;
      background: var(--bg);
      border: 1.5px dashed var(--ink-15);
      border-radius: 50%;
    }

    .product-card.highlight {
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(184,134,43,.18);
    }

    .card-id {
      position: absolute;
      top: .9rem;
      right: 1rem;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--ink-30);
    }

    .cat-tag {
      display: inline-block;
      font-size: .7rem;
      font-weight: 500;
      color: var(--primary);
      background: var(--primary-08);
      padding: .18rem .5rem;
      border-radius: 3px;
      margin-bottom: .55rem;
    }

    .product-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 .1rem;
      line-height: 1.3;
      padding-right: 2rem;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .9rem;
      padding-top: .8rem;
      border-top: 1px dashed var(--ink-15);
    }

    .price {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--brass);
    }

    .price::before {
      content: '$';
      font-size: .75em;
      margin-right: 1px;
    }

    .card-actions {
      display: flex;
      gap: .4rem;
    }

    /* =========================
       Toast
       ========================= */

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      z-index: 2000;
    }

    .toast {
      background: var(--surface);
      border-left: 3px solid var(--ink-30);
      padding: .7rem .9rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 20px rgba(27,31,39,.15);
      font-size: .85rem;
      max-width: 300px;
      transform: translateX(120%);
      opacity: 0;
      transition:
              transform .25s ease,
              opacity .25s ease;
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast-success {
      border-left-color: var(--success);
    }

    .toast-error {
      border-left-color: var(--danger);
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 600px) {
      .search-box input {
        width: 150px;
      }

      .hero {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="topbar">
  <a href="home.html" class="brand">
    <span aria-hidden="true">🏷️</span>
    Stockline
  </a>

  <nav class="nav-links">
    <a href="home.html" class="active" aria-current="page">Home</a>
    <a href="add.html">Add product</a>
  </nav>
</div>

<main class="container">

  <section class="hero">

    <div>
      <div class="hero-count" id="heroCount">—</div>
      <div class="hero-label" id="heroLabel">
        products in the catalog
      </div>
    </div>

    <div class="hero-controls">

      <div class="search-box">

        <input
                type="text"
                id="searchInput"
                placeholder="Search by name or category"
        >

        <button
                class="btn btn-outline"
                id="searchBtn"
                type="button">
          Search
        </button>

        <button
                class="btn btn-ghost"
                id="clearSearchBtn"
                type="button"
                hidden>
          Clear
        </button>

      </div>

      <button
              class="btn btn-outline"
              id="latestBtn"
              type="button">
        Show latest
      </button>

    </div>

  </section>

  <div id="banner"></div>

  <div id="loadingState" class="state-block">

    <div class="spinner"></div>

    <p>Loading products…</p>

  </div>

  <div id="errorState" class="state-block" hidden>

    <p id="errorText">
      Couldn't load products.
    </p>

    <button
            class="btn btn-primary"
            id="retryBtn"
            type="button">
      Retry
    </button>

  </div>

  <div id="emptyState" class="state-block" hidden>

    <p id="emptyText">
      No products yet — add your first one to get started.
    </p>

    <a
            href="add.html"
            class="btn btn-primary"
            id="emptyActionLink">
      Add product
    </a>

    <button
            class="btn btn-outline"
            id="emptyActionClear"
            type="button"
            hidden>
      Clear search
    </button>

  </div>

  <div id="grid" class="grid" hidden></div>

</main>

<div id="toastContainer" class="toast-container"></div>

<script>

  /*
   * If this file is not served by the Spring Boot app itself,
   * replace window.location.origin with the backend origin.
   *
   * Example:
   * http://localhost:8080
   */
  const API_BASE = `${window.location.origin}/api/v1/products`;


  /* =========================
     DOM References
     ========================= */

  const heroCount = document.getElementById('heroCount');
  const heroLabel = document.getElementById('heroLabel');

  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const clearSearchBtn = document.getElementById('clearSearchBtn');

  const latestBtn = document.getElementById('latestBtn');

  const banner = document.getElementById('banner');

  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const errorText = document.getElementById('errorText');
  const retryBtn = document.getElementById('retryBtn');

  const emptyState = document.getElementById('emptyState');
  const emptyText = document.getElementById('emptyText');
  const emptyActionLink = document.getElementById('emptyActionLink');
  const emptyActionClear = document.getElementById('emptyActionClear');

  const grid = document.getElementById('grid');

  const toastContainer = document.getElementById('toastContainer');


  /* =========================
     Utility Functions
     ========================= */

  function escapeHtml(str) {

    const div = document.createElement('div');

    div.textContent = str == null ? '' : String(str);

    return div.innerHTML;
  }


  /*
   * The controller's GET / and GET /{id}
   * wrap results in ApiResponseDto.
   *
   * This helper also supports direct array/object responses.
   */
  function unwrapData(json) {

    if (json === null || json === undefined) {
      return json;
    }

    if (Array.isArray(json)) {
      return json;
    }

    if (typeof json === 'object') {

      if ('data' in json) {
        return json.data;
      }

      if ('result' in json) {
        return json.result;
      }

      if ('payload' in json) {
        return json.payload;
      }
    }

    return json;
  }


  function extractErrorMessage(body, status) {

    if (!body) {
      return `Request failed (HTTP ${status})`;
    }

    if (Array.isArray(body.errors) && body.errors.length) {

      return body.errors
              .map(error => {

                if (typeof error === 'string') {
                  return error;
                }

                if (error.field && error.defaultMessage) {
                  return `${error.field}: ${error.defaultMessage}`;
                }

                return (
                        error.defaultMessage ||
                        error.message ||
                        JSON.stringify(error)
                );
              })
              .join(' | ');
    }

    if (typeof body.message === 'string' && body.message) {
      return body.message;
    }

    if (typeof body.detail === 'string' && body.detail) {
      return body.detail;
    }

    if (typeof body.error === 'string' && body.error) {
      return body.error;
    }

    return `Request failed (HTTP ${status})`;
  }


  /* =========================
     API
     ========================= */

  async function apiFetch(url, options) {

    let response;

    try {

      response = await fetch(url, options);

    } catch (error) {

      throw new Error(
              "Couldn't reach the server. Make sure the API is running."
      );
    }

    let body = null;

    const text = await response.text();

    if (text) {

      try {
        body = JSON.parse(text);
      } catch (error) {
        body = null;
      }
    }

    if (!response.ok) {
      throw new Error(
              extractErrorMessage(body, response.status)
      );
    }

    return body;
  }


  /* =========================
     Toast
     ========================= */

  function showToast(type, text, duration = 3500) {

    const toast = document.createElement('div');

    toast.className = `toast toast-${type}`;

    toast.textContent = text;

    toastContainer.appendChild(toast);

    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    setTimeout(() => {

      toast.classList.remove('show');

      setTimeout(() => {
        toast.remove();
      }, 300);

    }, duration);
  }


  /* =========================
     Flash Message
     ========================= */

  function showFlashIfAny() {

    try {

      const raw = sessionStorage.getItem('flashMessage');

      if (raw) {

        sessionStorage.removeItem('flashMessage');

        const message = JSON.parse(raw);

        showToast(
                message.type || 'success',
                message.text || 'Done.'
        );
      }

    } catch (error) {
      // Ignore invalid flash messages.
    }
  }


  /* =========================
     UI State
     ========================= */

  function setState(state) {

    loadingState.hidden = state !== 'loading';
    errorState.hidden = state !== 'error';
    emptyState.hidden = state !== 'empty';
    grid.hidden = state !== 'ready';
  }


  function resetEmptyStateDefault() {

    emptyText.textContent =
            'No products yet — add your first one to get started.';

    emptyActionLink.hidden = false;
    emptyActionClear.hidden = true;
  }


  function setEmptyStateForSearch(keyword) {

    emptyText.textContent =
            `No products match "${keyword}". Try a different search or clear it.`;

    emptyActionLink.hidden = true;
    emptyActionClear.hidden = false;
  }


  /* =========================
     Product Card
     ========================= */

  function cardHtml(product) {

    const price =
            isNaN(Number(product.price))
                    ? '0.00'
                    : Number(product.price).toFixed(2);

    return `
        <article
            class="product-card"
            data-id="${product.id}">

            <span class="card-id">
                #${product.id}
            </span>

            <span class="cat-tag">
                ${escapeHtml(product.category)}
            </span>

            <h3 class="product-name">
                ${escapeHtml(product.name)}
            </h3>

            <div class="price-row">

                <span class="price">
                    ${price}
                </span>

                <div class="card-actions">

                    <button
                        class="btn btn-outline btn-sm"
                        data-action="edit"
                        data-id="${product.id}"
                        type="button">
                        Edit
                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        data-action="delete"
                        data-id="${product.id}"
                        type="button">
                        Delete
                    </button>

                </div>

            </div>

        </article>
    `;
  }


  function renderGrid(products) {

    if (!products.length) {

      setState('empty');

      return;
    }

    grid.innerHTML = products
            .map(cardHtml)
            .join('');

    setState('ready');
  }


  function updateHero(count, label) {

    heroCount.textContent = count;
    heroLabel.textContent = label;
  }


  /* =========================
     Product Loading
     ========================= */

  let isFiltered = false;


  async function loadAll() {

    setState('loading');

    banner.className = '';
    banner.innerHTML = '';

    isFiltered = false;

    clearSearchBtn.hidden = true;

    resetEmptyStateDefault();

    try {

      const body = await apiFetch(API_BASE);

      const products = unwrapData(body) || [];

      updateHero(
              products.length,
              products.length === 1
                      ? 'product in the catalog'
                      : 'products in the catalog'
      );

      renderGrid(products);

    } catch (error) {

      errorText.textContent = error.message;

      setState('error');
    }
  }


  /* =========================
     Keyword Search
     ========================= */

  async function runKeywordSearch(keyword) {

    setState('loading');

    banner.className = '';
    banner.innerHTML = '';

    try {

      const body = await apiFetch(
              `${API_BASE}/search?keyword=${encodeURIComponent(keyword)}`
      );

      const results = unwrapData(body) || [];

      isFiltered = true;

      clearSearchBtn.hidden = false;

      updateHero(
              results.length,
              `matching "${keyword}"`
      );

      if (!results.length) {
        setEmptyStateForSearch(keyword);
      }

      renderGrid(results);

    } catch (error) {

      showToast('error', error.message);

      setState('ready');
    }
  }


  /* =========================
     Show Latest Product
     ========================= */

  async function showLatest() {

    latestBtn.disabled = true;

    try {

      const body = await apiFetch(
              `${API_BASE}/latest`
      );

      const product = unwrapData(body);

      if (!product || !product.id) {
        throw new Error('No products yet.');
      }

      if (isFiltered) {
        await loadAll();
      }

      requestAnimationFrame(() => {

        const card = grid.querySelector(
                `[data-id="${product.id}"]`
        );

        if (card) {

          card.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });

          card.classList.add('highlight');

          setTimeout(() => {
            card.classList.remove('highlight');
          }, 2200);
        }
      });

      banner.className = 'banner-visible';

      banner.innerHTML = `
            Latest product added:
            <strong>
                ${escapeHtml(product.name)}
            </strong>
            in
            ${escapeHtml(product.category)}.

            <button
                id="bannerClose"
                class="banner-close"
                type="button">
                Dismiss
            </button>
        `;

      document
              .getElementById('bannerClose')
              .addEventListener('click', () => {

                banner.className = '';
                banner.innerHTML = '';
              });

    } catch (error) {

      showToast('error', error.message);

    } finally {

      latestBtn.disabled = false;
    }
  }


  /* =========================
     Product Actions
     ========================= */

  grid.addEventListener('click', event => {

    const button =
            event.target.closest('button[data-action]');

    if (!button) {
      return;
    }

    const id = button.dataset.id;

    if (button.dataset.action === 'edit') {

      window.location.href =
              `add.html?id=${id}`;
    }

    if (button.dataset.action === 'delete') {

      window.location.href =
              `delete.html?id=${id}`;
    }
  });


  /* =========================
     Search Events
     ========================= */

  searchBtn.addEventListener('click', () => {

    const keyword = searchInput.value.trim();

    if (keyword) {

      runKeywordSearch(keyword);

    } else {

      loadAll();
    }
  });


  searchInput.addEventListener('keydown', event => {

    if (event.key === 'Enter') {
      searchBtn.click();
    }
  });


  clearSearchBtn.addEventListener('click', () => {

    searchInput.value = '';

    loadAll();
  });


  emptyActionClear.addEventListener('click', () => {

    searchInput.value = '';

    loadAll();
  });


  /* =========================
     Other Events
     ========================= */

  retryBtn.addEventListener(
          'click',
          loadAll
  );

  latestBtn.addEventListener(
          'click',
          showLatest
  );


  /* =========================
     Initial Load
     ========================= */

  showFlashIfAny();

  loadAll();

</script>

</body>
</html>
